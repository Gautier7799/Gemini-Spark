name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # تثبيت وضبط Gradle الكامل على بيئة GitHub
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # إعادة توليد ملفات Gradle Wrapper كاملة مع الـ JAR لضمان سلامتها
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # إنشاء ملف .env للمفاتيح
      - name: Create .env file
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'MY_GEMINI_API_KEY' }}" >> .env

      # بناء ملف APK بنجاح
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # رفع ملف الـ APK النهائي لتنزيله مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Spark-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
