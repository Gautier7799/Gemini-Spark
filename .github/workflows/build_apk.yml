name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # تجهيز وإعداد Gradle Wrapper تلقائياً حتى لو لم يكن ملف gradlew موجوداً في المشروع
      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      # إنشاء ملف .env للمفاتيح
      - name: Create .env file
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'MY_GEMINI_API_KEY' }}" >> .env

      # بناء ملف APK بنجاح
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # رفع ملف الـ APK الناتج كـ Artifact لتنزيله فوراً
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
