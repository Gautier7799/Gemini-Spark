name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: List Repository Contents and Locate Project
        id: locate_project
        run: |
          echo "=== محتويات المستودع الحالية ==="
          ls -la
          echo "==============================="
          
          # البحث بعمق عن ملف settings.gradle.kts أو settings.gradle
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::ملفات المشروع غير موجودة في المستودع! يرجى رفع مجلد app وملفات gradle إلى GitHub."
            find . -type f | head -n 30
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "تم العثور على المشروع في المسار: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "جاري إنشاء gradle wrapper..."
            gradle wrapper --gradle-version 8.8
          fi
          chmod +x gradlew

      - name: Create .env file
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'MY_GEMINI_API_KEY' }}" >> .env

      - name: Build APK with Gradle
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Spark-Debug-APK
          path: ${{ steps.locate_project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
