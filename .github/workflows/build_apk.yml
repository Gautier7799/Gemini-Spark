name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # العثور على المجلد الذي يحتوي على settings.gradle.kts تلقائياً
      - name: Locate Project and Setup Gradle
        id: locate_project
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not find settings.gradle[.kts] anywhere in the repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Android project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      # توليد أو التأكد من ملفات الـ Wrapper داخل مجلد المشروع
      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          gradle wrapper --gradle-version 8.8
          chmod +x gradlew

      # إنشاء ملف .env للمفاتيح داخل مجلد المشروع
      - name: Create .env file
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'MY_GEMINI_API_KEY' }}" >> .env

      # بناء ملف APK بنجاح
      - name: Build APK with Gradle
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # رفع ملف الـ APK الناتج كـ Artifact لتنزيله فوراً
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Spark-Debug-APK
          path: ${{ steps.locate_project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
